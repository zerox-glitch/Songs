<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11162c">
  <meta name="description" content="An audio-reactive cinematic lyric experience for Keep the Fire Burning.">
  <title>Keep the Fire Burning — Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="player">
    <div id="photo-a" class="photo visible" aria-hidden="true"></div>
    <div id="photo-b" class="photo" aria-hidden="true"></div>
    <canvas id="visual" aria-hidden="true"></canvas>
    <div class="veil"></div>
    <header class="brand"><span class="brand-mark">✦</span><span>AN INTERCONTINENTAL LOVE SONG</span></header>
    <section class="center">
      <p class="eyebrow">LAHORE AT DAWN · YOUR SHORE AT MIDNIGHT</p>
      <h1>Keep the Fire <em>Burning</em></h1>
      <p class="subline">A quiet kind of love that never fades.</p>
      <div class="lyric-wrap" aria-live="polite">
        <p id="section" class="section">PRESS PLAY TO BEGIN</p>
        <p id="lyric" class="lyric">A half a world away, a different sky…</p>
      </div>
      <div class="controls">
        <button id="play" type="button" aria-label="Play song"><span id="play-icon">▶</span></button>
        <div class="track">
          <div class="time-row"><span id="now">0:00</span><span id="duration">3:45</span></div>
          <input id="seek" type="range" min="0" max="224.832" value="0" step="0.1" aria-label="Seek through song">
        </div>
        <button id="mute" type="button" aria-label="Mute audio">♫</button>
      </div>
      <audio id="audio" preload="metadata" src="../Keep%20the%20Fire%20Burning%20(Remastered).mp3"></audio>
    </section>
    <footer><span>KEEP THE FIRE BURNING</span><span>VISUAL STORY · 01</span></footer>
  </main>
  <script src="visualizer.js"></script>
</body>
</html>
