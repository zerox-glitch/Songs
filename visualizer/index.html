<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071326">
  <meta name="description" content="A cinematic, audio-reactive lyric experience for Keep the Fire Burning.">
  <title>Keep the Fire Burning</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="player">
    <div id="photo-a" class="photo visible" aria-hidden="true"></div>
    <div id="photo-b" class="photo" aria-hidden="true"></div>
    <canvas id="visual" aria-hidden="true"></canvas>
    <div class="veil"></div>
    <div id="title" class="title">Keep the Fire Burning</div>
    <div class="lyric-wrap" aria-live="polite"><p id="lyric" class="lyric"></p></div>
    <div class="controls">
      <button id="play" type="button" aria-label="Play song"><span id="play-icon">▶</span></button>
      <input id="seek" type="range" min="0" max="224.832" value="0" step="0.1" aria-label="Seek through song">
      <button id="mute" type="button" aria-label="Mute audio">♫</button>
    </div>
    <audio id="audio" preload="metadata" src="../Keep%20the%20Fire%20Burning%20(Remastered).mp3"></audio>
  </main>
  <script src="visualizer.js"></script>
</body>
</html>
